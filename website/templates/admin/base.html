<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Analytics{% endblock %} · Card Machines Direct admin</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/work-sans-latin-var.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset('css/site.css') }}">
</head>
<body class="admin">
  <header class="site-header"><div class="wrap">
    <a class="wordmark" href="{{ url_for('admin_dashboard') }}">Card Machines <span>Direct</span></a>
    <nav class="nav tabs" aria-label="Admin">
      <a href="{{ url_for('admin_dashboard', days=days, source=source) }}" {% if request.endpoint == 'admin_dashboard' %}aria-current="page"{% endif %}>Journeys</a>
      <a href="{{ url_for('admin_leads', days=days, source=source) }}" {% if request.endpoint == 'admin_leads' %}aria-current="page"{% endif %}>Quote requests</a>
      <a href="{{ url_for('home') }}">View site</a>
    </nav>
  </div></header>
  <main class="wrap" style="padding:2rem 0 5rem">{% block content %}{% endblock %}</main>
</body>
</html>
